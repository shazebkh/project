version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cleanstreak-postgres
    restart: always
    environment:
      POSTGRES_USER: cleanstreak
      POSTGRES_PASSWORD: cleanstreak_secret
      POSTGRES_DB: cleanstreak_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cleanstreak-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: cleanstreak-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
